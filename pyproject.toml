[project]
name = "hotspot-harmony"
version = "0.1.0"
description = "Harmonized MODIS + VIIRS active-fire hotspot record and burning activity calendar (data: NASA FIRMS)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "requests>=2.32",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "shapely>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "api"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "api/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["research", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
