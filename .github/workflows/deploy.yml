name: Deploy

# Every push to main deploys the part of the demo it changes, after that part's checks pass:
# the API on Render (through its deploy hook), the web app on Cloudflare (wrangler, web/wrangler.jsonc).
# The secrets are set once by the repository owner; without them a job warns and deploys nothing.
# Setup and the names of the secrets: docs/DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in the order of the pushes.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.diff.outputs.api }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A manual run, or a push whose previous commit is unknown, deploys both parts.
          if [ "$EVENT" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" HEAD)
          echo "$changed"
          if grep -qE '^(api/|pipeline/|config/|Dockerfile$|\.dockerignore$|pyproject\.toml$|uv\.lock$)' <<< "$changed"; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^web/' <<< "$changed"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
      - name: Ask Render to build and deploy main
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set, so the API was not deployed. See docs/DEPLOY.md."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Render is building the API from main."

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://hotspot-harmony.onrender.com' }}
      - name: Upload to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so the web app was not deployed. See docs/DEPLOY.md."
            exit 0
          fi
          npx --yes wrangler@4.162.0 deploy
