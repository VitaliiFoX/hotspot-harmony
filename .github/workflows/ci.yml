name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  english:
    # The project language is English: tracked files, commit messages, PR title and body.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_english.py
        env:
          COMMIT_RANGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('{0}..HEAD', github.event.before) || 'origin/main..HEAD' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
